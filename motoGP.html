
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Page MotoGP</title>
    <style>
        /* Estilos básicos para que se vea moderno */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #e10600; /* Rojo característico de MotoGP */
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            padding: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MOTO GP</h1>
        <p>La máxima velocidad sobre dos ruedas</p>
    </header>

    <div class="container">
        <h2>Galería de Motos de Pista</h2>
        
        <div class="gallery">
            <!-- Tarjeta 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1599819811279-d5ad9cccf838?auto=format&fit=crop&w=600&q=80" alt="Moto Deportiva 1">
                <div class="card-content">
                    <h3>Ducati Desmosedici</h3>
                </div>
            </div>

            <!-- Tarjeta 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=600&q=80" alt="Moto Deportiva 2">
                <div class="card-content">
                    <h3>Yamaha YZR-M1</h3>
                </div>
            </div>

            <!-- Tarjeta 3 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1614165933026-0750fcd503e8?auto=format&fit=crop&w=600&q=80" alt="Moto Deportiva 3">
                <div class="card-content">
                    <h3>Honda RC213V</h3>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Fan Page MotoGP - Adrenalina Pura</p>
    </footer>

</body>
</html>
